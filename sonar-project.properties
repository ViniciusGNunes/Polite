# Must be unique in a given SonarQube instance
sonar.projectKey=polite-extension

# This is the name and version displayed in the SonarQube UI
sonar.projectName=Polite - Corretor IA Groq
sonar.projectVersion=1.0.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src
# If you eventually write unit tests, point SonarQube to them here:
# sonar.tests=tests

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Files to exclude from analysis (Plasmo outputs and dependencies)
sonar.exclusions=build/**, .plasmo/**, node_modules/**, **/*.d.ts

# Linter and Coverage reports (Uncomment and configure if you add ESLint/Jest later)
# sonar.eslint.reportPaths=eslint-report.json
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
